services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: gatepass
      MYSQL_USER: ${DB_USER:-gatepass_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gatepass_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-gatepass_user}
      DB_PASSWORD: ${DB_PASSWORD:-gatepass_pass}
      DB_NAME: gatepass
      JWT_SECRET: ${JWT_SECRET:-please_change_this_secret}
      JWT_EXPIRES_IN: 8h
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    ports:
      - "5000:5000"
    volumes:
      - api_uploads:/app/uploads

  client:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  db_data:
  api_uploads:
